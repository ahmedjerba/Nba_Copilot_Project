shrinkage:
  methode: bayesien_empirique_continu
  k_default: 600
  k_metriques:
    pts_per100: 450
    fga_per100: 450
    fgm_per100: 450
    reb_per100: 500
    dreb_per100: 500
    oreb_per100: 600
    ast_per100: 600
    tov_per100: 600
    pf_per100: 600
    fg3m_per100: 700
    fg3a_per100: 700
    ftm_per100: 600
    fta_per100: 600
    stl_per100: 800
    blk_per100: 800
    blka_per100: 800
    plus_minus_per100: 1000
  note: >
    Formulation bayésienne empirique continue : (poss * stat + k * mu_saison) / (poss + k).
    k calibré selon le ratio variance intra/inter-joueurs de chaque métrique.
    Moyennes mu_saison calculées rigoureusement par saison sur les joueurs fiables sans fuite temporelle.
  metriques_a_shrinker:
    - pts_per100
    - reb_per100
    - ast_per100
    - stl_per100
    - blk_per100
    - tov_per100
    - fgm_per100
    - fga_per100
    - fg3m_per100
    - fg3a_per100
    - ftm_per100
    - fta_per100
    - oreb_per100
    - dreb_per100
    - plus_minus_per100
    - blka_per100
    - pf_per100
  metriques_non_shrinkees:
    note: ces colonnes sont des ratios stables, pas de shrinkage
    liste:
      - fg_pct
      - fg3_pct
      - ft_pct
      - efg_pct
      - ts_pct
      - off_rating
      - def_rating
      - net_rating
      - usg_pct
      - pie
      - ast_pct
      - ast_to
      - ast_ratio
      - oreb_pct
      - dreb_pct
      - reb_pct
      - tm_tov_pct
      - fgm_adv
      - fga_adv
      - fg_pct_adv



null_semantics:
